<!DOCTYPE html>
<html>
<head>
    <script>
        function changeBG() {
            document.body.style.backgroundColor = "lightblue";
        }
        function resetBG() {
            document.body.style.backgroundColor = "white";
        }
        function focusInput(x) {
            x.style.background = "yellow";
        }
    </script>
</head>
<body onmouseover="changeBG()" onmouseout="resetBG()">
    <h2>Welcome to My Homepage</h2>
    <input type="text" onfocus="focusInput(this)" placeholder="Enter your name">
</body>
</html>
